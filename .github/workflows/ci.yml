name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run env:init
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e libs/imukit -e 'apps/bridge[dev]'
      - run: python -m pytest -q
        working-directory: apps/bridge
      - run: python -m ruff check . ../../libs/imukit
        working-directory: apps/bridge
      - run: python -m bridge.cli scan --demo --out /tmp/findings.json
        working-directory: apps/bridge
